<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Tomcat</title>
</head>
<body>

    <!-- Le formulaire pointe vers /titi en méthode POST -->

        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
